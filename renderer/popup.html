<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Popup</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      height: 36px; overflow: hidden; user-select: none;
      background: var(--bg0, #0d0d10);
      font: 13px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #7777aa;
      border-bottom: 1px solid #2a2a35;
      display: flex; align-items: center; gap: 4px; padding: 0 8px;
      -webkit-app-region: drag;
    }
    button {
      -webkit-app-region: no-drag;
      background: transparent; border: none; color: inherit;
      cursor: pointer; border-radius: 4px; font-size: 14px;
      width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
      transition: background .12s, color .12s; flex-shrink: 0;
    }
    button:hover { background: #222228; color: #e0e0ee; }
    #x:hover { background: #dd4444; color: #fff; }
    #title { flex: 1; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 8px; -webkit-app-region: drag; }
    #win { display: flex; gap: 2px; -webkit-app-region: no-drag; }
  </style>
</head>
<body>
  <button onclick="api.popupBack()">&#8592;</button>
  <button onclick="api.popupForward()">&#8594;</button>
  <span id="title">Učitavanje...</span>
  <div id="win">
    <button onclick="api.popupMin()">&#8722;</button>
    <button onclick="api.popupMax()">&#9633;</button>
    <button id="x" onclick="api.popupClose()">&#10005;</button>
  </div>
  <script>api.onPopupTitle(t => document.getElementById('title').textContent = t);</script>
</body>
</html>
