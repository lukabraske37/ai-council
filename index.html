<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Council</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="titlebar">
    <span id="tb-title">⚡ AI Council</span>
    <div id="tb-btns">
      <button id="btn-min">&#8722;</button>
      <button id="btn-max">&#9633;</button>
      <button id="btn-close">&#10005;</button>
    </div>
  </div>

  <div id="toolbar">
    <div id="preset-btns"></div>
    <div id="divider"></div>
    <div id="pane-builder"></div>
    <button id="btn-apply">Apply</button>
    <button id="btn-edit" title="Uredi presets">⚙</button>
  </div>

  <div id="overlay" class="hidden">
    <div id="modal">
      <div id="modal-head">
        <span>Uredi presets</span>
        <button id="modal-x">✕</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
